backend:
  name: github
  repo: Herobot-klassenassistent/schotman-guitars
  branch: main
  base_url: https://schotman.netlify.app
  auth_endpoint: /.netlify/functions/auth

# Robert uploads photos here; they're saved with the site
media_folder: "assets/uploads"
public_folder: "assets/uploads"

# Show a friendly editor, not code
site_url: https://schotman.com
display_url: https://schotman.com
logo_url: /assets/img/logo.png

collections:
  # ===================== SHOP =====================
  - name: "shop"
    label: "🎸 Guitars"
    files:
      - name: "guitars"
        label: "All guitars"
        file: "content/shop.json"
        description: "Add, edit, reorder or remove guitars. Drag the ⠿ handle to reorder. Set status, mark a guitar as Featured to show it big at the top of the shop, and add a Sale price for discounts."
        fields:
          - name: "guitars"
            label: "Guitars"
            label_singular: "Guitar"
            widget: "list"
            summary: "{{fields.name}} — {{fields.status}}{{#if fields.featured}} ★{{/if}}"
            fields:
              - { name: "id", label: "ID (short, no spaces — e.g. 8141s-blue)", widget: "string", hint: "Used in the web address. Letters, numbers and dashes only." }
              - { name: "name", label: "Name", widget: "string" }
              - { name: "subtitle", label: "Subtitle / series", widget: "string", required: false }
              - { name: "price", label: "Price (€)", widget: "number", value_type: "int", min: 0 }
              - { name: "salePrice", label: "Sale price (€) — leave empty for no discount", widget: "number", value_type: "int", min: 0, required: false, hint: "If filled and lower than the price, the guitar shows a SALE badge with the old price crossed out." }
              - { name: "currency", label: "Currency", widget: "select", options: ["EUR","USD","GBP"], default: "EUR" }
              - name: "status"
                label: "Status"
                widget: "select"
                options:
                  - { label: "In stock", value: "in-stock" }
                  - { label: "Sold", value: "sold" }
                  - { label: "Reserved", value: "reserved" }
                  - { label: "New", value: "new" }
                default: "in-stock"
              - { name: "featured", label: "⭐ Featured (big spot at top of the shop + homepage)", widget: "boolean", default: false }
              - { name: "image", label: "Main photo", widget: "image", required: true }
              - name: "gallery"
                label: "Gallery photos"
                widget: "list"
                required: false
                field: { name: "image", label: "Photo", widget: "image" }
              - { name: "wood", label: "Woods (short, for cards)", widget: "string", required: false }
              - { name: "hardware", label: "Hardware (short, for cards)", widget: "string", required: false }
              - { name: "description", label: "Description", widget: "text", required: false }
              - name: "specs"
                label: "Specifications"
                widget: "list"
                required: false
                label_singular: "Spec"
                summary: "{{fields.label}}: {{fields.value}}"
                fields:
                  - { name: "label", label: "Spec name (e.g. Body)", widget: "string" }
                  - { name: "value", label: "Detail (e.g. Mahogany)", widget: "string" }
              - name: "passport"
                label: "📜 Certificate of Authenticity (optional)"
                widget: "object"
                required: false
                collapsed: true
                hint: "Fill this in to give the guitar a digital passport page + downloadable certificate."
                fields:
                  - { name: "serial", label: "Serial number", widget: "string", required: false }
                  - { name: "buildYear", label: "Build year", widget: "string", required: false }
                  - { name: "buildNo", label: "Build number (this one)", widget: "number", required: false, value_type: "int" }
                  - { name: "totalBuilt", label: "Total built so far", widget: "number", required: false, value_type: "int" }
                  - { name: "builtFor", label: "Built for (artist / owner)", widget: "string", required: false }
                  - { name: "woodOrigin", label: "Wood & origin", widget: "string", required: false }
                  - { name: "signature", label: "Signed by", widget: "string", required: false, default: "Robert Schotman" }
                  - { name: "pdf", label: "PDF certificate file", widget: "file", required: false }
              - name: "diary"
                label: "🛠️ Build diary (optional)"
                widget: "list"
                required: false
                label_singular: "Step"
                summary: "{{fields.title}}"
                fields:
                  - { name: "image", label: "Photo", widget: "image" }
                  - { name: "title", label: "Step title", widget: "string" }
                  - { name: "caption", label: "Caption", widget: "text", required: false }

  # ===================== BLOG =====================
  - name: "blog"
    label: "📝 Blog"
    files:
      - name: "posts"
        label: "Blog posts"
        file: "content/blog.json"
        description: "Write and ramble. New posts appear at the top of the Blog page. Untick 'Published' to hide a draft."
        fields:
          - name: "posts"
            label: "Posts"
            label_singular: "Post"
            widget: "list"
            summary: "{{fields.title}}{{#if fields.published}}{{else}} (draft){{/if}}"
            fields:
              - { name: "id", label: "ID (short, no spaces — e.g. new-workshop)", widget: "string", hint: "Used in the web address." }
              - { name: "title", label: "Title", widget: "string" }
              - { name: "date", label: "Date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
              - { name: "published", label: "Published", widget: "boolean", default: true }
              - { name: "image", label: "Header photo", widget: "image", required: false }
              - { name: "excerpt", label: "Short summary (shown on the blog list)", widget: "text", required: false }
              - { name: "body", label: "Post", widget: "markdown" }
