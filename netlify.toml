# Static site assembled into ./dist (keeps node_modules out of the deploy).
# The editor at /admin talks to the serverless functions in netlify/functions,
# which store content + photos in Netlify Blobs. No external CMS, no rebuilds.
[build]
  publish = "dist"
  command = "bash scripts/assemble-dist.sh"
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
