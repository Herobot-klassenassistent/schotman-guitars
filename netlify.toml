# The site itself is static; the build step only compiles the TinaCMS editor (/admin).
# The "|| echo" keeps deploys working even before the Tina Cloud keys are set —
# the site always publishes; the editor appears once TINA env vars exist.
[build]
  publish = "."
  command = "npm ci && (npx tinacms build || echo 'Tina admin build skipped — set NEXT_PUBLIC_TINA_CLIENT_ID + TINA_TOKEN')"

[build.environment]
  NODE_VERSION = "20"

# Security + caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
